# Copy the manifest template, stage assets, and set environment variables first.
seed: 42
action_dim: 2
upstream_revisions:
  nano_world_model: cc1f151a9d8c7d7afd0cdc5de6a9ae220a7c90c0
  robo_jepa: f93106f5f4a451fd526d51778aa8ab7c852eb824
  vjepa2: 204698b45b3712590f06245fbfba32d3be539812
representation:
  id: vjepa2.1-G-384-image-bilinear256-imagenet-layernorm-v1
  shape: {channels: 1664, height: 16, width: 16, views: 1}
encoder:
  kind: robojepa
  repo: ${oc.env:VJEPA2_REPO}
  checkpoint: ${oc.env:VJEPA2_CHECKPOINT}
  input_size: [256, 256]
  frozen: true
target_decay: 0.99
protocol:
  dataset_id: REPLACE_WITH_DATASET_AND_VERSION
  action_id: REPLACE_WITH_TRAIN_ONLY_ACTION_STATISTICS_AND_UNITS
  evaluation_id: REPLACE_WITH_FIXED_EPISODES_AND_GOALS
  context_frames: 2
  horizon: 7
  frame_interval: 1
  split_unit: episode
  comparison: shared_frozen_representation
data:
  manifest: ${oc.env:LATENT_MANIFEST}
  frames: 9
  stride: 1
rollout:
  kind: autoregressive
  context_frames: ${protocol.context_frames}
  detach_feedback: false
  state_policy: required
training:
  steps: 10000
  batch_size: 4
  lr: 0.0001
  encoder_lr: 0.00001
  weight_decay: 0.01
  grad_clip: 1.0
  bf16: true
  eval_every: 500
  checkpoint_seconds: 1800
logging:
  project: nanowm
  entity: yibozhong657-none
  mode: online
planning:
  action_low: [-1.0, -1.0]
  action_high: [1.0, 1.0]
  execute_steps: 1
  cem:
    horizon: ${protocol.horizon}
    samples: 128
    elites: 16
    iterations: 5
    initial_std: 1.0
    min_std: 0.05
    chunk_size: 16
    metric: mse
    risk_samples: 1
evaluation:
  environment_factory: YOUR_ENV_MODULE:create_environment
  episodes: ${oc.env:PLANNING_EPISODES,fixed-planning-episodes.json}
  max_steps: 100
